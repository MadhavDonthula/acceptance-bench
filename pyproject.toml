[project]
name = "acceptance-bench"
version = "0.1.0"
description = "Honest pilot benchmark: does CoralBricks fast inference reach ACCEPTED coding work faster than Baseten (same model, same harness, same task)?"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "matplotlib>=3.8",
    "pytest>=8.0",
    "fastapi>=0.110",
]

[tool.pytest.ini_options]
addopts = "-q"

[tool.setuptools]
packages = ["proxy", "harness", "judge"]
